<div class="album-listing {{ include.class }}">
    {% if include.image_src == nil %}
        <img src="/assets/images/covers/unknown.png">
    {% else %}
        <img src="{{ include.image_src | relative_url }}">
    {% endif %}

    <a href="{{ include.link | relative_url }}"><p>{{ include.title }} ({{ include.year }})</p></a>
</div>
